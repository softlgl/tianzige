<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>礼物田字格字帖</title>
    <link rel="stylesheet" href="./style/style.css?v=18">
</head>
<body>
    <!-- 工具栏：输入 + 设置 + 保存 -->
    <div class="input-container">
        <input type="text" id="character-input" placeholder="请输入汉字，如：金木水火土">
        <div class="field">
            <span class="field-label">字号</span>
            <select id="font-size-select">
                <option value="60">60% 小</option>
                <option value="70">70% 较小</option>
                <option value="80" selected>80% 标准</option>
                <option value="90">90% 较大</option>
                <option value="100">100% 大</option>
            </select>
        </div>
        <div class="field">
            <span class="field-label">描红</span>
            <select id="trace-count-select">
                <option value="0">不描红</option>
                <option value="1">1 个</option>
                <option value="2" selected>2 个</option>
                <option value="3">3 个</option>
                <option value="4">4 个</option>
                <option value="5">5 个</option>
                <option value="10">整行</option>
            </select>
        </div>
        <div class="field">
            <span class="field-label">格子</span>
            <select id="grid-type-select">
                <option value="tian" selected>田字格</option>
                <option value="mi">米字格</option>
            </select>
        </div>
        <label class="strip-toggle">
            <input type="checkbox" id="stroke-strip-toggle">笔顺图
        </label>
        <span class="toolbar-divider"></span>
        <!-- 保存按钮 -->
        <div class="save-dropdown">
            <button class="save-button" id="save-button">
                保存
                <span class="arrow">&#9660;</span>
            </button>
            <div class="save-options">
                <div class="save-option" data-format="image">保存为图片</div>
                <div class="save-option" data-format="pdf">保存为PDF</div>
                <div class="save-option" data-format="print">直接打印</div>
            </div>
        </div>
    </div>

    <!-- A4 页面容器（多页动态生成） -->
    <div id="pages-container"></div>

    <!-- 引入拼音库 -->
    <script src="./js/pinyin-pro.js"></script>
    <!-- 引入 html2canvas -->
    <script src="./js/html2canvas.min.js"></script>
    <!-- 引入 jsPDF -->
    <script src="./js/jspdf.min.js"></script>
    <!-- 引入 JSZip（多页图片打包下载） -->
    <script src="./js/jszip.min.js"></script>
    <!-- 引入 HanziWriter（笔顺演示） -->
    <script src="./js/hanzi-writer.min.js"></script>
    <script src="./js/tzg.js?v=15"></script>
</body>
</html>
